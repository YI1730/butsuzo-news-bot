name: Send Reaction Replies

# PWA の「👍 反応したい投稿」で「仏像リンクで返信」を押すと、送信予約が非公開リポジトリ
# （butsuzo-private の reply_queue.json）に積まれ、公開側の data/reaction_kick.json（中身は時刻だけ）
# が更新される。その push をきっかけに、仏像リンクのアカウントから X API で返信する。
# ログには件数だけを出す（このリポジトリと Actions のログは公開のため）。
on:
  push:
    branches: [main]
    paths: [data/reaction_kick.json]
  workflow_dispatch:

permissions:
  contents: read

# 非公開リポジトリの reactions.json を書き換える news_hourly.yml と直列化する
concurrency:
  group: news-json
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout private data
        uses: actions/checkout@v4
        with:
          repository: YI1730/butsuzo-private
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          path: private

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send replies
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          PRIVATE_DIR: private
        run: python send_reaction_replies.py

      - name: Save results to private repo
        if: always()
        run: |
          cd private
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reactions.json reply_queue.json
          git diff --staged --quiet && exit 0
          git commit -q -m "send reaction replies"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
