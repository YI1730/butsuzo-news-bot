name: Auto Post Hourly

on:
  schedule:
    # 毎時0分は GitHub 全体で混み、実行が間引かれやすいので避け、1時間に2回実行する
    - cron: "17,47 * * * *"   # JSTの各「時」を評価（投稿済みなら何もしない）
  workflow_dispatch:
    inputs:
      hour:
        description: "テスト用: JSTの時(0-23)を上書き。空なら現在時"
        required: false
        default: ""
      dry_run:
        description: "true で投稿せず予定だけ表示"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: post-hourly
  cancel-in-progress: false

jobs:
  post_hourly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib
      - name: Post
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.hour }}" ]; then ARGS="$ARGS --hour ${{ github.event.inputs.hour }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python post_hourly.py $ARGS
      - name: Commit logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/post_history.json data/scheduled_log.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore: update auto-post logs"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No log changes"
          fi
