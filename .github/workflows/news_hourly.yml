name: Fetch News Hourly

# Google ニュースを毎時取り込む（速報性のため）。
# 特別公開・特別展・Amazon は従来どおり auto_post.yml が 1日6回取得する。
on:
  schedule:
    # 毎時10分（:00 は GitHub Actions が混雑して実行が間引かれやすいので避ける）
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# news.json を書き換えるワークフロー同士が同時に走って push が衝突しないよう直列化する
concurrency:
  group: news-json
  cancel-in-progress: false

jobs:
  fetch_news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch news (Google RSS)
        run: python post_news.py

      - name: Generate dashboard HTML
        run: python generate_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/gnews_url_cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "chore: fetch news (hourly)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push に失敗、再試行 ($i)"; sleep 10
          done
          exit 1
