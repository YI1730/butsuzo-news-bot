name: Fetch News Hourly

# Google ニュースと公式サイトの新着を毎時取り込み、AI 採点・御開帳カレンダー・返信の仕分けを行う。
# 特別公開・特別展・Amazon は従来どおり auto_post.yml が 1日6回取得する。
on:
  schedule:
    # 毎時10分（:00 は GitHub Actions が混雑して実行が間引かれやすいので避ける）
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# news.json を書き換えるワークフロー同士が同時に走って push が衝突しないよう直列化する
concurrency:
  group: news-json
  cancel-in-progress: false

jobs:
  fetch_news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch news (Google RSS)
        run: python post_news.py

      # 寺院・博物館・文化庁の公式サイトの新着お知らせ（一次情報）を取り込む
      - name: Watch official sites
        continue-on-error: true
        run: python watch_sites.py

      # Claude で採点し、配信候補の投稿文を作ってスマホに通知する
      - name: Curate news with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python curate_news.py

      # 記事の公開期間を御開帳カレンダーに集め、「あすから」等の節目でリマインドを作る
      - name: Kaicho calendar reminders
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        continue-on-error: true
        run: python kaicho_calendar.py

      # 仏像リンク宛ての返信を取得し、返信すべきものを選んで返信案を作る
      - name: Triage replies
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC:            ${{ secrets.NTFY_TOPIC }}
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        # 返信の取得に失敗してもニュースの更新は止めない
        continue-on-error: true
        run: python triage_replies.py

      - name: Generate dashboard HTML
        run: python generate_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/gnews_url_cache.json data/replies.json data/watch_state.json data/kaicho_calendar.json
          if git diff --staged --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "chore: fetch news (hourly)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push に失敗、再試行 ($i)"; sleep 10
          done
          exit 1
