name: Fetch News Hourly

# Google ニュースと公式サイトの新着を毎時取り込み、AI 採点・御開帳カレンダー・返信の仕分けを行う。
# 特別公開・特別展・Amazon は従来どおり auto_post.yml が 1日6回取得する。
on:
  schedule:
    # 毎時10分（:00 は GitHub Actions が混雑して実行が間引かれやすいので避ける）
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      force_reactions:
        description: "反応したい投稿を時間帯に関係なく今すぐ読む（テスト用）"
        type: boolean
        default: false

permissions:
  contents: write

# news.json を書き換えるワークフロー同士が同時に走って push が衝突しないよう直列化する
concurrency:
  group: news-json
  cancel-in-progress: false

jobs:
  fetch_news:
    runs-on: ubuntu-latest
    env:
      # 非公開リポジトリの鍵があるときだけ「反応したい投稿」を動かす
      HAS_PRIVATE: ${{ secrets.PRIVATE_REPO_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        # 予約時点ではなく実行時点の最新 main を取る（待ち中に他の実行が push すると衝突するため）
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch news (Google RSS)
        run: python post_news.py

      # 寺院・博物館・文化庁の公式サイトの新着お知らせ（一次情報）を取り込む
      - name: Watch official sites
        continue-on-error: true
        run: python watch_sites.py

      # Claude で採点し、配信候補の投稿文を作ってスマホに通知する
      - name: Curate news with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python curate_news.py

      # 記事の公開期間を御開帳カレンダーに集め、「あすから」等の節目でリマインドを作る
      - name: Kaicho calendar reminders
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        continue-on-error: true
        run: python kaicho_calendar.py

      # 書籍（Amazon）の紹介する価値を採点し、PWA の書籍一覧の並び順に使う（新しい本のときだけ API を呼ぶ）
      - name: Rank books
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: python rank_books.py

      # 仏像リンク宛ての返信を取得し、返信すべきものを選んで返信案を作る
      - name: Triage replies
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC:            ${{ secrets.NTFY_TOPIC }}
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        # 返信の取得に失敗してもニュースの更新は止めない
        continue-on-error: true
        run: python triage_replies.py

      # 「反応したい投稿」: X リストの新着から、いいね・リポストしたい投稿を選ぶ（1日2回だけ読む）。
      # 取得した投稿は非公開リポジトリにだけ保存する（このリポジトリと Actions のログは公開のため）
      - name: Checkout private data
        if: env.HAS_PRIVATE == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: YI1730/butsuzo-private
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          path: private

      - name: Pick posts to react to
        if: env.HAS_PRIVATE == 'true'
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC:            ${{ secrets.NTFY_TOPIC }}
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_LIST_STARTERS:       ${{ secrets.X_LIST_STARTERS }}
          X_LIST_FRIENDS:        ${{ secrets.X_LIST_FRIENDS }}
          FORCE_REACTIONS:       ${{ inputs.force_reactions && '1' || '0' }}
          PRIVATE_DIR: private
        continue-on-error: true
        run: |
          python pick_reactions.py
          cd private
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reactions.json
          git diff --staged --quiet || { git commit -q -m "update reactions" && git push -q; }

      - name: Generate dashboard HTML
        run: python generate_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/gnews_url_cache.json data/replies.json data/watch_state.json data/kaicho_calendar.json
          if git diff --staged --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "chore: fetch news (hourly)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push に失敗、再試行 ($i)"; sleep 10
          done
          exit 1
