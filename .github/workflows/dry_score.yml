name: Dry-run Scoring (proposal)
# 採点ルールの見直し案で、指定した記事を試し採点する（保存しない・手動実行）
on:
  workflow_dispatch:
    inputs:
      title_words:
        description: "試す記事のタイトルに含まれる語（カンマ区切り）"
permissions:
  contents: read
jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TITLE_WORDS: ${{ inputs.title_words }}
        run: python tools/dry_score.py
