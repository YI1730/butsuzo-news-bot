name: Test Official Page Search
on:
  workflow_dispatch:
    inputs:
      title_words:
        description: "試す記事のタイトルに含まれる語（カンマ区切り）"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TITLE_WORDS: ${{ inputs.title_words }}
          DEBUG_OFFICIAL: "1"
        run: python tools/test_official.py
