name: Send Replies

# PWA の「💬返信」タブで返信を確定すると data/reply_queue.json が更新され、
# その push をきっかけにすぐ送信する（仏像リンクのアカウントから X API で返信）。
on:
  push:
    branches: [main]
    paths: [data/reply_queue.json]
  workflow_dispatch:

permissions:
  contents: write

# replies.json を書き換える他のワークフローと直列化する
concurrency:
  group: news-json
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send replies
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python reply_send.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/replies.json data/reply_queue.json
          if git diff --staged --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "chore: send replies"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push に失敗、再試行 ($i)"; sleep 10
          done
          exit 1
