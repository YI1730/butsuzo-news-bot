name: Gallery Watch

# 国立博物館（東博・京博・奈良博・九博）の平常展示（名品ギャラリー）で、仏像の展示が替わる・終わりに近づくとき、
# 配信候補にする（gallery_watch.py）。毎日 1 回（朝 7:10）。取得は 3 秒おき。
# 仏像かどうかの判定・特徴の抽出は軽いモデルのみ（1 回の実行で特徴の抽出は 30 件まで）
on:
  schedule:
    - cron: "10 22 * * *"   # JST 毎日 07:10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-json
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Watch museum galleries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gallery_watch.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gallery_watch.json data/exhibit_watch.json docs/data/news.json
          if git diff --staged --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "chore: update gallery watch"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push に失敗、再試行 ($i)"; sleep 10
          done
          exit 1
