name: Update Buddhist News Dashboard

# Google ニュースは news_hourly.yml が毎時取得する。ここでは特別公開・特別展・Amazon を取得。

on:
  schedule:
    # JST 6:30 / 10:30 / 15:30 / 17:30 / 20:30 / 23:30
    - cron: "30 21,1,6,8,11,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

# news_hourly.yml と同時に走って news.json の push が衝突しないよう直列化する
concurrency:
  group: news-json
  cancel-in-progress: false

jobs:
  update_dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 予約時点ではなく実行時点の最新 main を取る（待ち中に他の実行が push すると衝突するため）
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch special sites
        run: python scrape_special.py

      - name: Fetch exhibition info
        run: python scrape_exhibition.py

      # Amazon の検索（書籍・グッズの新刊、雑誌の新しい号）は GitHub Actions からだと 503 で断られるため、
      # 運営者の Mac で 2 日に 1 回動かしている（tools/run_amazon_local.sh）。ここでは動かさない

      # 雑誌の仏像特集号（サライなど、号の題名に「仏像」が入らないもの）を Fujisan・ニュース・Mac が Amazon で見つけた号から判定して書籍欄に加える
      - name: Find magazine Buddhist-statue specials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: python scrape_magazines.py

      - name: Generate dashboard HTML
        run: python generate_dashboard.py

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update news dashboard"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi
