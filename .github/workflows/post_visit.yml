name: Auto Post Visit Tweets

on:
  schedule:
    # UTC 11:00 / 23:00 = JST 20:00 / 翌08:00（1日2件）
    - cron: "0 11,23 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "投稿件数"
        required: false
        default: "1"
      dry_run:
        description: "true で投稿せず候補だけ表示"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: post-visit
  cancel-in-progress: false

jobs:
  post_visit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib

      - name: Post visit tweet(s)
        env:
          X_API_KEY:              ${{ secrets.X_API_KEY }}
          X_API_SECRET:           ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:         ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:  ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python post_visit_tweet.py --count "$COUNT" --dry-run
          else
            python post_visit_tweet.py --count "$COUNT"
          fi

      - name: Commit post history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/post_history.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update visit post history"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No history changes to commit"
          fi
